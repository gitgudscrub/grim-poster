name: Build Windows preview

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: GrimPoster
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.12'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/build-public.py
      - run: python -m unittest discover -s relay -p 'test_*.py'
      - uses: actions/upload-artifact@v4
        with:
          name: GrimPoster-0.2.0-unsigned-Windows-x64
          path: GrimPoster/dist/GrimPoster-0.2.0-unsigned.exe
          if-no-files-found: error
